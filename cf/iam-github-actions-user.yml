AWSTemplateFormatVersion: "2010-09-09"
Description: >
  IAM user for GitHub Actions CI/CD pipelines with a broad allow-all policy
  minus explicitly denied catastrophic/account-level actions.
  Access keys are NOT created here — run bin/create-github-actions-credentials.sh
  after deploying this stack.

# ─────────────────────────────────────────────────────────────────────────────
# Parameters
# ─────────────────────────────────────────────────────────────────────────────
Parameters:
  AppName:
    Type: String
    Default: webapp
    Description: App namespace — used for tagging.

  AwsAccountId:
    Type: String
    Description: AWS account ID.

  Region:
    Type: String
    Default: ap-southeast-2
    Description: Primary region.

  UserName:
    Type: String
    Default: github-actions-webapp
    Description: IAM username to create.

# ─────────────────────────────────────────────────────────────────────────────
# Metadata
# ─────────────────────────────────────────────────────────────────────────────
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: "Identity"}
        Parameters: [AppName, UserName]
      - Label: {default: "Account"}
        Parameters: [AwsAccountId, Region]

# ─────────────────────────────────────────────────────────────────────────────
# Resources
# ─────────────────────────────────────────────────────────────────────────────
Resources:

  # ══════════════════════════════════════════════════════════════════════════
  # IAM User
  # ══════════════════════════════════════════════════════════════════════════
  GitHubActionsUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Ref UserName
      Tags:
        - Key: AppName
          Value: !Ref AppName
        - Key: managed_by
          Value: cloudformation
        - Key: git_repo
          Value: https://github.com/kurogami207176/webapp-environment-setup

  # ══════════════════════════════════════════════════════════════════════════
  # Policy — broad allow-all with explicit denies on catastrophic actions
  #
  # Denied categories:
  #   - AWS Organizations & account closure
  #   - Billing / cost management modifications
  #   - IAM user/group/key management (can't create new principals or escalate)
  #   - MFA device management
  #   - S3 bucket deletion
  #   - Audit trail tampering (CloudTrail, GuardDuty, SecurityHub, Config)
  #   - KMS key destruction
  # ══════════════════════════════════════════════════════════════════════════
  WebappDeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: GitHubActionsWebappDeployPolicy
      Description: !Sub "GitHub Actions broad deploy policy for ${AppName} — denies only catastrophic actions"
      Users:
        - !Ref GitHubActionsUser
      PolicyDocument:
        Version: "2012-10-17"
        Statement:

          - Sid: AllowAll
            Effect: Allow
            Action: "*"
            Resource: "*"

          - Sid: DenyAccountNuke
            Effect: Deny
            Action:
              # AWS Organizations
              - organizations:*

              # Account closure
              - account:CloseAccount

              # Billing
              - billing:*
              - budgets:ModifyBudget
              - aws-portal:Modify*

              # IAM — MFA devices
              - iam:CreateVirtualMFADevice
              - iam:DeleteVirtualMFADevice
              - iam:DeactivateMFADevice
              - iam:EnableMFADevice
              - iam:ResyncMFADevice

              # IAM — console login profiles
              - iam:CreateLoginProfile
              - iam:UpdateLoginProfile
              - iam:DeleteLoginProfile

              # IAM — account-level settings
              - iam:CreateAccountAlias
              - iam:DeleteAccountAlias
              - iam:UpdateAccountPasswordPolicy
              - iam:DeleteAccountPasswordPolicy
              - iam:SetSecurityTokenServicePreferences

              # IAM — user/group management (prevent privilege escalation)
              - iam:CreateUser
              - iam:DeleteUser
              - iam:UpdateUser
              - iam:AttachUserPolicy
              - iam:DetachUserPolicy
              - iam:PutUserPolicy
              - iam:DeleteUserPolicy
              - iam:CreateAccessKey
              - iam:DeleteAccessKey
              - iam:UpdateAccessKey
              - iam:CreateGroup
              - iam:DeleteGroup
              - iam:AddUserToGroup
              - iam:RemoveUserFromGroup
              - iam:AttachGroupPolicy
              - iam:DetachGroupPolicy
              - iam:PutGroupPolicy
              - iam:DeleteGroupPolicy

              # S3 — bucket deletion
              - s3:DeleteBucket

              # Audit trail tampering
              - cloudtrail:DeleteTrail
              - cloudtrail:StopLogging
              - guardduty:DeleteDetector
              - guardduty:DisassociateFromMasterAccount
              - securityhub:DisableSecurityHub
              - config:DeleteConfigurationRecorder
              - config:StopConfigurationRecorder

              # Encryption
              - ec2:DisableEbsEncryptionByDefault
              - kms:ScheduleKeyDeletion
              - kms:DisableKey

            Resource: "*"

# ─────────────────────────────────────────────────────────────────────────────
# Outputs
# ─────────────────────────────────────────────────────────────────────────────
Outputs:

  UserName:
    Description: IAM username
    Value: !Ref GitHubActionsUser
    Export:
      Name: !Sub "${AppName}-GitHubActionsUserName"

  UserArn:
    Description: IAM user ARN
    Value: !GetAtt GitHubActionsUser.Arn
    Export:
      Name: !Sub "${AppName}-GitHubActionsUserArn"

  WebappDeployPolicyArn:
    Description: ARN of GitHubActionsWebappDeployPolicy
    Value: !Ref WebappDeployPolicy
    Export:
      Name: !Sub "${AppName}-GitHubActionsWebappDeployPolicyArn"
