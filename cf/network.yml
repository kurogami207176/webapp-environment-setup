AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Network foundation — VPC, 2-AZ public / private / isolated subnets,
  Internet Gateway, single NAT Gateway (private tier), Security Groups.
  Outputs are exported so downstream stacks (database, ECS, etc.) can
  import them without hard-coding IDs.

# ─────────────────────────────────────────────────────────────────────────────
# Parameters
# ─────────────────────────────────────────────────────────────────────────────
Parameters:
  AppName:
    Type: String
    Default: webapp
    Description: Short name used to namespace every resource and export.

  Env:
    Type: String
    AllowedValues: [dev, staging, production]
    Description: Deployment environment (dev | staging | production).

  VpcCidr:
    Type: String
    Default: "10.0.0.0/16"
    Description: CIDR block for the VPC.

  # ── Public subnets (ALB / NAT GW) ──────────────────────────────────────────
  PublicSubnet1Cidr:
    Type: String
    Default: "10.0.0.0/24"
  PublicSubnet2Cidr:
    Type: String
    Default: "10.0.1.0/24"

  # ── Private subnets (app servers / Lambda / ECS tasks) ─────────────────────
  PrivateSubnet1Cidr:
    Type: String
    Default: "10.0.10.0/24"
  PrivateSubnet2Cidr:
    Type: String
    Default: "10.0.11.0/24"

  # ── Isolated subnets (RDS / Aurora — no internet route) ────────────────────
  IsolatedSubnet1Cidr:
    Type: String
    Default: "10.0.20.0/24"
  IsolatedSubnet2Cidr:
    Type: String
    Default: "10.0.21.0/24"

# ─────────────────────────────────────────────────────────────────────────────
# Metadata — console grouping
# ─────────────────────────────────────────────────────────────────────────────
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: "Identity"}
        Parameters: [AppName, Env]
      - Label: {default: "VPC CIDR Blocks"}
        Parameters:
          - VpcCidr
          - PublicSubnet1Cidr
          - PublicSubnet2Cidr
          - PrivateSubnet1Cidr
          - PrivateSubnet2Cidr
          - IsolatedSubnet1Cidr
          - IsolatedSubnet2Cidr

# ─────────────────────────────────────────────────────────────────────────────
# Resources
# ─────────────────────────────────────────────────────────────────────────────
Resources:

  # ══════════════════════════════════════════════════════════════════════════
  # VPC
  # ══════════════════════════════════════════════════════════════════════════
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-${Env}-vpc"
        - Key: Env
          Value: !Ref Env
        - Key: AppName
          Value: !Ref AppName

  # ══════════════════════════════════════════════════════════════════════════
  # Internet Gateway
  # ══════════════════════════════════════════════════════════════════════════
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-${Env}-igw"

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # ══════════════════════════════════════════════════════════════════════════
  # Public Subnets
  # ══════════════════════════════════════════════════════════════════════════
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-${Env}-public-1"
        - Key: Tier
          Value: public

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-${Env}-public-2"
        - Key: Tier
          Value: public

  # ══════════════════════════════════════════════════════════════════════════
  # Private Subnets (app tier)
  # ══════════════════════════════════════════════════════════════════════════
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-${Env}-private-1"
        - Key: Tier
          Value: private

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-${Env}-private-2"
        - Key: Tier
          Value: private

  # ══════════════════════════════════════════════════════════════════════════
  # Isolated Subnets (database tier — no route to internet)
  # ══════════════════════════════════════════════════════════════════════════
  IsolatedSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref IsolatedSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-${Env}-isolated-1"
        - Key: Tier
          Value: isolated

  IsolatedSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref IsolatedSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-${Env}-isolated-2"
        - Key: Tier
          Value: isolated

  # ══════════════════════════════════════════════════════════════════════════
  # NAT Gateway  (single, in AZ-1 public subnet — cost-optimised)
  # ══════════════════════════════════════════════════════════════════════════
  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-${Env}-nat-eip"

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-${Env}-natgw"

  # ══════════════════════════════════════════════════════════════════════════
  # Route Tables
  # ══════════════════════════════════════════════════════════════════════════

  # ── Public route table ────────────────────────────────────────────────────
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-${Env}-public-rt"

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # ── Private route table (routes outbound via NAT GW) ─────────────────────
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-${Env}-private-rt"

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ── Isolated route table (no outbound route — DB tier) ───────────────────
  IsolatedRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-${Env}-isolated-rt"

  IsolatedSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref IsolatedSubnet1
      RouteTableId: !Ref IsolatedRouteTable

  IsolatedSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref IsolatedSubnet2
      RouteTableId: !Ref IsolatedRouteTable

  # ══════════════════════════════════════════════════════════════════════════
  # Security Groups
  # ══════════════════════════════════════════════════════════════════════════

  # ── ALB Security Group ────────────────────────────────────────────────────
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "ALB — allow HTTP/HTTPS from internet"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: "0.0.0.0/0"
          Description: "HTTP from internet"
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: "0.0.0.0/0"
          Description: "HTTPS from internet"
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
          Description: "Allow all outbound"
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-${Env}-alb-sg"

  # ── App Security Group ────────────────────────────────────────────────────
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "App tier — allow traffic from ALB only"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: "App port from ALB"
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
          Description: "Allow all outbound"
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-${Env}-app-sg"

  # ── Database Security Group ───────────────────────────────────────────────
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Database tier — allow PostgreSQL from app tier only"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: "PostgreSQL from app tier"
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
          Description: "Allow all outbound"
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-${Env}-db-sg"

# ─────────────────────────────────────────────────────────────────────────────
# Outputs  (exported so database.yml and other stacks can import them)
# ─────────────────────────────────────────────────────────────────────────────
Outputs:

  VpcId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub "${AppName}-${Env}-VpcId"

  VpcCidr:
    Description: VPC CIDR block
    Value: !GetAtt VPC.CidrBlock
    Export:
      Name: !Sub "${AppName}-${Env}-VpcCidr"

  PublicSubnet1Id:
    Description: Public Subnet AZ-1
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub "${AppName}-${Env}-PublicSubnet1Id"

  PublicSubnet2Id:
    Description: Public Subnet AZ-2
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub "${AppName}-${Env}-PublicSubnet2Id"

  PublicSubnetIds:
    Description: Comma-separated public subnet IDs
    Value: !Join [",", [!Ref PublicSubnet1, !Ref PublicSubnet2]]
    Export:
      Name: !Sub "${AppName}-${Env}-PublicSubnetIds"

  PrivateSubnet1Id:
    Description: Private Subnet AZ-1
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub "${AppName}-${Env}-PrivateSubnet1Id"

  PrivateSubnet2Id:
    Description: Private Subnet AZ-2
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub "${AppName}-${Env}-PrivateSubnet2Id"

  PrivateSubnetIds:
    Description: Comma-separated private subnet IDs
    Value: !Join [",", [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]
    Export:
      Name: !Sub "${AppName}-${Env}-PrivateSubnetIds"

  IsolatedSubnet1Id:
    Description: Isolated (DB) Subnet AZ-1
    Value: !Ref IsolatedSubnet1
    Export:
      Name: !Sub "${AppName}-${Env}-IsolatedSubnet1Id"

  IsolatedSubnet2Id:
    Description: Isolated (DB) Subnet AZ-2
    Value: !Ref IsolatedSubnet2
    Export:
      Name: !Sub "${AppName}-${Env}-IsolatedSubnet2Id"

  IsolatedSubnetIds:
    Description: Comma-separated isolated subnet IDs
    Value: !Join [",", [!Ref IsolatedSubnet1, !Ref IsolatedSubnet2]]
    Export:
      Name: !Sub "${AppName}-${Env}-IsolatedSubnetIds"

  AlbSecurityGroupId:
    Description: ALB Security Group ID
    Value: !Ref AlbSecurityGroup
    Export:
      Name: !Sub "${AppName}-${Env}-AlbSecurityGroupId"

  AppSecurityGroupId:
    Description: App tier Security Group ID
    Value: !Ref AppSecurityGroup
    Export:
      Name: !Sub "${AppName}-${Env}-AppSecurityGroupId"

  DatabaseSecurityGroupId:
    Description: Database Security Group ID
    Value: !Ref DatabaseSecurityGroup
    Export:
      Name: !Sub "${AppName}-${Env}-DatabaseSecurityGroupId"
