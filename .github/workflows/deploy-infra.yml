name: Deploy Infrastructure

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
#   push to main          → production (requires environment approval)
#   workflow_dispatch     → production (manual trigger, same gate)
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
    paths:
      - "cf/**"
      - "bin/deploy-*.sh"
      - ".github/workflows/deploy-infra.yml"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate templates only — no deploy"
        required: false
        type: boolean
        default: false

# ─────────────────────────────────────────────────────────────────────────────
# Concurrency — one deploy at a time, never cancel in-flight
# ─────────────────────────────────────────────────────────────────────────────
concurrency:
  group: infra-production
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────────────────
# Permissions
# ─────────────────────────────────────────────────────────────────────────────
permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
# Top-level env
# ─────────────────────────────────────────────────────────────────────────────
env:
  TARGET_ENV: production
  DRY_RUN:    ${{ inputs.dry_run || 'false' }}

# ─────────────────────────────────────────────────────────────────────────────
# Jobs
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # 1. Validate — always runs, no AWS credentials needed
  # ════════════════════════════════════════════════════════════════════════════
  validate:
    name: Validate templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Lint CloudFormation templates (cfn-lint)
        run: |
          pip install cfn-lint --quiet
          cfn-lint cf/dns-config.yml
          cfn-lint cf/network.yml
          cfn-lint cf/database.yml
          echo "✓ All templates pass cfn-lint"

  # ════════════════════════════════════════════════════════════════════════════
  # 2. Gate — production requires manual approval.
  #    In repo Settings → Environments → production, add required reviewers.
  # ════════════════════════════════════════════════════════════════════════════
  approve-production:
    name: Await production approval
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Approved
        run: echo "Production deployment approved — proceeding."

  # ════════════════════════════════════════════════════════════════════════════
  # 3. Deploy DNS config (hosted zone ID + domain name → SSM)
  # ════════════════════════════════════════════════════════════════════════════
  deploy-dns-config:
    name: Deploy DNS config
    needs: approve-production
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: Deploy DNS config stack
        run: |
          ./bin/deploy-dns-config.sh \
            --region "${{ vars.AWS_REGION }}" \
            ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}

  # ════════════════════════════════════════════════════════════════════════════
  # 4. Deploy network stack
  # ════════════════════════════════════════════════════════════════════════════
  deploy-network:
    name: Deploy network (production)
    needs: deploy-dns-config
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity
          echo "Account: ${{ secrets.AWS_ACCOUNT_ID }}"
          echo "Region:  ${{ vars.AWS_REGION }}"

      - name: Deploy network stack
        run: |
          ./bin/deploy-network.sh \
            --env    production \
            --region "${{ vars.AWS_REGION }}" \
            ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}

      - name: Summary — network outputs
        if: env.DRY_RUN != 'true'
        run: |
          APP_NAME=$(python3 -c "import json; params=json.load(open('cf/params/network.production.json')); print(next(p['ParameterValue'] for p in params if p['ParameterKey']=='AppName'))")
          STACK="${APP_NAME}-production-network"
          {
            echo "## Network stack outputs"
            echo ""
            echo '```'
            aws cloudformation describe-stacks \
              --stack-name "${STACK}" \
              --region "${{ vars.AWS_REGION }}" \
              --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
              --output table
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ════════════════════════════════════════════════════════════════════════════
  # 5. Deploy database stack (runs after network is confirmed healthy)
  # ════════════════════════════════════════════════════════════════════════════
  deploy-database:
    name: Deploy database (production)
    needs: deploy-network
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: Deploy database stack
        run: |
          ./bin/deploy-database.sh \
            --env    production \
            --region "${{ vars.AWS_REGION }}" \
            ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}

      - name: Summary — database outputs
        if: env.DRY_RUN != 'true'
        run: |
          APP_NAME=$(python3 -c "import json; params=json.load(open('cf/params/database.production.json')); print(next(p['ParameterValue'] for p in params if p['ParameterKey']=='AppName'))")
          STACK="${APP_NAME}-production-database"
          {
            echo "## Database stack outputs"
            echo ""
            echo '```'
            aws cloudformation describe-stacks \
              --stack-name "${STACK}" \
              --region "${{ vars.AWS_REGION }}" \
              --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
              --output table
            echo '```'
            echo ""
            echo "### Secrets Manager paths"
            echo "| Secret | Path |"
            echo "|--------|------|"
            echo "| Master credentials | \`/${APP_NAME}/production/database/master_cred\` |"
            echo "| App connection     | \`/${APP_NAME}/production/database/app\` |"
          } >> "$GITHUB_STEP_SUMMARY"
